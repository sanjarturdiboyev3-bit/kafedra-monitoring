<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
(function () {
  "use strict";
  
  const API_BASE = "https://kafedra-worker.sanjarturdiboyev3.workers.dev/api/";

  var YEAR = "2026-2027", YS = Date.UTC(2026, 8, 1), YE = Date.UTC(2027, 5, 30), GAP = 20;
  var CATS = [["ilmiy", "Ilmiy-tadqiqot"], ["uslubiy", "O'quv-uslubiy"], ["ustoz", "Ustoz-shogird"], ["manaviy", "Ma'naviy-ma'rifiy"], ["tijorat", "Tijoratlashtirish"]];
  var CATN = {}; CATS.forEach(function (c) { CATN[c[0]] = c[1]; });
  var KINDS = [
    ["scopus", /scopus|web of science/i, "Scopus / Web of Science maqola"], ["impakt", /impakt/i, "Impakt-faktorli xalqaro jurnal"], ["oak", /oak ro/i, "OAK ro'yxatidagi jurnal maqolasi"],
    ["xconf", /xalqaro ilmiy-amaliy konf/i, "Xalqaro konferensiya"], ["rconf", /respublika ilmiy-amaliy konf/i, "Respublika konferensiyasi"], ["monografiya", /monografiya/i, "Monografiya"],
    ["dastur", /dastur|raqamli mahsulot|guvohnoma/i, "Dastur / elektron baza (guvohnoma)"], ["opponent", /opponent/i, "Opponentlik, taqriz, kengash a'zoligi"],
    ["talaba", /talaba/i, "Talabalar ilmiy rahbarligi"], ["loyiha", /loyihalarda/i, "Ilmiy loyihada ishtirok"], ["seminar", /seminar/i, "Ilmiy-uslubiy seminar tashkil etish"]
  ];
  var STATUS = { rejalashtirilgan: "Rejalashtirilgan", jarayonda: "Jarayonda", bajarildi: "Bajarildi", ozgartirildi: "Asosli o'zgartirildi" };
  var SCLS = { rejalashtirilgan: "mute", jarayonda: "warn", bajarildi: "good", ozgartirildi: "" };
  var POS = ["Professor", "Dotsent", "Katta o'qituvchi", "O'qituvchi", "Stajor o'qituvchi", "Assistent"];
  var UNITS = ["ta", "nafar", "semestr", "so'm"];
  var NAV = [["panel", "Boshqaruv paneli"], ["teachers", "O'qituvchilar"], ["plans", "Shaxsiy ish rejalari"], ["log", "Bajarilgan ishlar"], ["report", "Hisobotlar"], ["tg", "Telegram xabarlari"], ["import", "Rejani yuklash (Word)", true]];

  var S = { admin: true, teachers: [], items: [], comps: [], got: { t: 0, i: 0, c: 0 }, page: "panel", f: {}, edit: null, addOpen: false, teEdit: null, confirm: null, msg: null, demo: false, err: "", late: false, tgKind: "haftalik", imp: null, done: {}, by: {}, tmap: {} };
  var app = document.getElementById("app");

  // ... (Barcha yordamchi funksiyalar: el, fmtDate, today va hokazolar oldingidek qoladi) ...
  // ... (Hisob-kitob funksiyalari: calc, info, stats va hokazolar oldingidek qoladi) ...
  // ... (Word parser, Telegram xabarlari, formalar oldingidek qoladi) ...

  // ---------- API so'rovlari (Firebase o'rniga Cloudflare) ----------
  async function fetchTable(table) {
    const res = await fetch(API_BASE + table);
    return await res.json();
  }

  async function insertRow(table, data) {
    const res = await fetch(API_BASE + table, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });
    return await res.json();
  }

  // ---------- Ma'lumotlarni yuklash ----------
  async function start() {
    render();
    try {
      S.teachers = await fetchTable("teachers");
      S.items = await fetchTable("items");
      S.comps = await fetchTable("completions");
      S.got = { t: 1, i: 1, c: 1 };
      render();
    } catch (e) {
      S.err = "Bazadan o'qishda xato: " + e.message;
      render();
    }
  }

  // ... (Sahifalar va render funksiyalari oldingidek qoladi) ...

  start();
})();
</script>

</body></html>
